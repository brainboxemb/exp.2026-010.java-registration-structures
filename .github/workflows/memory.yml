name: Retained memory probe

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/ranking-structures-clean
    paths:
      - src/main/**
      - src/jmh/**
      - pom.xml
      - .github/workflows/memory.yml

jobs:
  memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build benchmark jar with JOL
        run: mvn -B -Pjmh -DskipTests package

      - name: Measure retained object graphs
        run: |
          java -Djdk.attach.allowAttachSelf=true -cp target/benchmarks.jar emb.experiment.jmh.MemoryFootprintProbe > memory-footprint.csv
          cat memory-footprint.csv

      - uses: actions/upload-artifact@v4
        with:
          name: experiment-010-memory
          path: memory-footprint.csv
          retention-days: 30
